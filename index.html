
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b19">
<title>Mi biblioteca</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
:root {
  --bg: #100b19;
  --panel: #1b1427;
  --panel2: #261b35;
  --text: #f8f2ff;
  --muted: #b8a9c8;
  --accent: #c69aff;
  --border: #382747;
  --danger: #ff8f9b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #291b3d, var(--bg) 65%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100vh;
}
body.light {
  --bg: #f5effb;
  --panel: #fff;
  --panel2: #eee3fa;
  --text: #271a36;
  --muted: #75647f;
  --accent: #8150b6;
  --border: #dfd0ec;
  background: var(--bg);
}
button, input { font: inherit; }
button {
  border: 1px solid var(--border);
  color: var(--text);
  background: var(--panel2);
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
  transition: .15s;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary {
  background: var(--accent);
  color: #1b1028;
  font-weight: 700;
}
button.danger { color: var(--danger); }
header {
  padding: 22px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: linear-gradient(135deg, #d5b2ff, #8652b5);
  color: #20102e;
  font-size: 24px;
}
h1 { font-size: 22px; margin: 0; }
.subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
main { max-width: 1200px; margin: auto; padding: 24px 16px 60px; }
.intro { margin-bottom: 25px; }
.intro h2 { font-size: 27px; margin: 0 0 8px; }
p { color: var(--muted); line-height: 1.5; }
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap;
  margin: 20px 0;
}
input[type="search"] {
  flex: 1; min-width: 180px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 12px;
  padding: 12px;
}
.section-title {
  font-size: 17px;
  margin: 26px 0 15px;
}
.library {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 16px;
}
.book-card {
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 16px;
}
.cover {
  height: 175px;
  border-radius: 10px;
  background: linear-gradient(145deg, #49305f, #171020);
  display: grid;
  place-items: center;
  font-size: 44px;
  margin-bottom: 12px;
}
.book-title {
  font-weight: 650;
  font-size: 14px;
  overflow-wrap: anywhere;
  line-height: 1.4;
}
.book-meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
.progress {
  height: 4px; border-radius: 9px;
  background: var(--border); margin: 10px 0;
  overflow: hidden;
}
.progress span { display: block; height: 100%; background: var(--accent); }
.card-actions { display: grid; gap: 7px; margin-top: 10px; }
.card-actions button { width: 100%; font-size: 12px; padding: 9px 5px; }
.empty {
  border: 1px dashed var(--border);
  border-radius: 16px;
  padding: 28px 18px;
  text-align: center;
  color: var(--muted);
  grid-column: 1 / -1;
}
#status {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

/* Lector */
#reader {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  overflow: auto;
  background: var(--bg);
  padding: max(12px, env(safe-area-inset-top)) 12px
           max(12px, env(safe-area-inset-bottom));
}
#reader.active { display: block; }
.reader-card {
  min-height: 100%;
  max-width: 1200px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.reader-top, .reader-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.reader-top h2 {
  font-size: 15px;
  overflow-wrap: anywhere;
  flex: 1;
  min-width: 120px;
  margin: 0;
}
.reader-tools { justify-content: center; }
#pageInfo { color: var(--muted); font-size: 13px; text-align: center; }
#flipHost {
  width: 100%;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
}
#flipbook {
  margin: auto;
  max-width: 100%;
}
.reader-bottom {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
#reader.reader-fullscreen {
  padding: max(6px, env(safe-area-inset-top)) 6px
           max(6px, env(safe-area-inset-bottom));
}
.reader-fullscreen .reader-card {
  max-width: none;
  min-height: calc(100dvh - 12px);
}
.reader-fullscreen #flipHost { min-height: 0; }
.reader-fullscreen .reader-top { flex-shrink: 0; }
.reader-fullscreen .reader-bottom { flex-shrink: 0; }
@media (max-width: 600px) {
  header { padding: 16px 12px; }
  main { padding: 20px 12px 40px; }
  .intro h2 { font-size: 23px; }
  .library { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .book-card { padding: 10px; }
  .cover { height: 145px; }
  button { padding: 9px 11px; }
}
</style>
</head>

<body>
<header>
  <div class="brand">
    <div class="logo">♧</div>
    <div>
      <h1>Mi biblioteca</h1>
      <div class="subtitle">Tu rincón de lectura digital</div>
    </div>
  </div>
  <div class="header-actions">
    <button id="themeBtn" type="button">☼ Tema</button>
    <button class="primary" id="importBtn" type="button">＋ Añadir PDF</button>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
  </div>
</header>

<main id="libraryPage">
  <section class="intro">
    <h2>Un libro, tu propio mundo. 💜</h2>
    <p>Guardá tus libros PDF y retomá la lectura cuando quieras.</p>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar un libro...">
    <button id="showAllBtn" type="button">Todos</button>
    <button id="showFinishedBtn" type="button">Terminados</button>
  </div>

  <div id="status" role="status">Preparando tu biblioteca...</div>
  <h3 class="section-title" id="shelfTitle">Mis libros</h3>
  <section class="library" id="library"></section>
</main>

<section id="reader" aria-label="Lector de libros">
  <div class="reader-card" id="readerCard">
    <div class="reader-top">
      <button id="closeBtn" type="button">← Biblioteca</button>
      <h2 id="readerTitle">Leyendo...</h2>
      <button id="fullscreenBtn" type="button">⛶ Pantalla completa</button>
    </div>

    <div id="flipHost">
      <div id="flipbook"></div>
    </div>

    <div id="pageInfo">Preparando páginas...</div>

    <div class="reader-bottom">
      <button id="prevBtn" type="button">← Anterior</button>
      <button id="nextBtn" class="primary" type="button">Siguiente →</button>
    </div>

    <div class="reader-tools">
      <button id="bookmarkBtn" type="button">☆ Guardar página</button>
      <button id="bookmarksBtn" type="button">Mis marcadores</button>
      <button id="finishBtn" type="button">✓ Marcar terminado</button>
    </div>
  </div>
</section>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const DB_NAME = "mi-biblioteca-db";
  const STORE = "books";

  let db;
  let books = [];
  let currentBook = null;
  let pageFlip = null;
  let pageUrls = [];
  let filterMode = "all";
  let isFullscreen = false;
  let savingProgress = false;

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  function setStatus(message) {
    $("status").textContent = message;
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);

      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains(STORE)) {
          database.createObjectStore(STORE, { keyPath: "id" });
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function getAllBooks() {
    return new Promise((resolve, reject) => {
      const request = db.transaction(STORE, "readonly")
        .objectStore(STORE).getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  function saveBook(book) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE, "readwrite");
      transaction.objectStore(STORE).put(book);
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });
  }

  function deleteBook(id) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE, "readwrite");
      transaction.objectStore(STORE).delete(id);
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    });
  }

  function safeText(value) {
    return String(value ?? "");
  }

  function renderLibrary() {
    const query = $("search").value.trim().toLowerCase();
    const filtered = books.filter(book => {
      const matchesSearch = safeText(book.title).toLowerCase().includes(query);
      const matchesMode = filterMode === "all" || book.finished;
      return matchesSearch && matchesMode;
    });

    $("shelfTitle").textContent =
      filterMode === "finished" ? "Libros terminados" : "Mis libros";

    const container = $("library");
    container.replaceChildren();

    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = query
        ? "No encontré libros con ese nombre."
        : filterMode === "finished"
          ? "Todavía no marcaste libros como terminados."
          : "Tu biblioteca está esperando su primer libro. 💜";
      container.appendChild(empty);
      return;
    }

    filtered.forEach(book => {
      const card = document.createElement("article");
      card.className = "book-card";

      const cover = document.createElement("div");
      cover.className = "cover";
      cover.textContent = book.finished ? "✓" : "📖";

      const title = document.createElement("div");
      title.className = "book-title";
      title.textContent = book.title || "Libro sin título";

      const pageCount = Number(book.totalPages) || 0;
      const currentPage = Number(book.currentPage) || 0;
      const progress = pageCount
        ? Math.min(100, Math.round(((currentPage + 1) / pageCount) * 100))
        : 0;

      const meta = document.createElement("div");
      meta.className = "book-meta";
      meta.textContent = book.finished
        ? "Terminado ✓"
        : `${progress}% leído`;

      const bar = document.createElement("div");
      bar.className = "progress";
      const fill = document.createElement("span");
      fill.style.width = progress + "%";
      bar.appendChild(fill);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const readBtn = document.createElement("button");
      readBtn.className = "primary";
      readBtn.textContent = "Leer libro";
      readBtn.addEventListener("click", () => openBook(book.id));

      const removeBtn = document.createElement("button");
      removeBtn.className = "danger";
      removeBtn.textContent = "Eliminar";
      removeBtn.addEventListener("click", async () => {
        if (!confirm(`¿Eliminar "${book.title}" de tu biblioteca?`)) return;
        try {
          await deleteBook(book.id);
          await refreshLibrary();
          setStatus("Libro eliminado.");
        } catch (error) {
          alert("No se pudo eliminar el libro.");
        }
      });

      actions.append(readBtn, removeBtn);
      card.append(cover, title, meta, bar, actions);
      container.appendChild(card);
    });
  }

  async function refreshLibrary() {
    books = await getAllBooks();
    books.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderLibrary();
    setStatus(`${books.length} libro(s) en tu biblioteca.`);
  }

  function canvasToUrl(canvas) {
    return new Promise((resolve, reject) => {
      const finish = (blob) => {
        if (!blob) {
          reject(new Error("No se pudo convertir una página del PDF."));
          return;
        }
        resolve(URL.createObjectURL(blob));
      };

      try {
        canvas.toBlob(finish, "image/webp", 0.94);
      } catch (error) {
        try {
          canvas.toBlob(finish, "image/jpeg", 0.94);
        } catch (secondError) {
          reject(secondError);
        }
      }
    });
  }

  function releasePageUrls() {
    pageUrls.forEach(url => URL.revokeObjectURL(url));
    pageUrls = [];
  }

  function resetFlipbook() {
    if (pageFlip) {
      try { pageFlip.destroy(); } catch (error) {}
      pageFlip = null;
    }

    // StPageFlip elimina su elemento raíz al destruirse.
    // Por eso creamos uno nuevo dentro del contenedor permanente.
    const host = $("flipHost");
    host.replaceChildren();

    const root = document.createElement("div");
    root.id = "flipbook";
    host.appendChild(root);

    return root;
  }

  async function importPdf(file) {
    if (!file) return;
    if (file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")) {
      alert("Elegí un archivo PDF.");
      return;
    }

    setStatus("Importando PDF...");
    $("importBtn").disabled = true;

    try {
      const data = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({
        data: data.slice(0)
      }).promise;

      const book = {
        id: (crypto.randomUUID ? crypto.randomUUID() :
          `${Date.now()}-${Math.random().toString(16).slice(2)}`),
        title: file.name.replace(/\.pdf$/i, ""),
        filename: file.name,
        data: data,
        totalPages: pdf.numPages,
        currentPage: 0,
        finished: false,
        bookmarks: [],
        createdAt: Date.now()
      };

      await saveBook(book);
      await refreshLibrary();
      setStatus(`"${book.title}" se agregó correctamente.`);
    } catch (error) {
      console.error(error);
      alert("No pude importar el PDF. Puede estar dañado o ser demasiado grande.");
      setStatus("No se pudo importar el PDF.");
    } finally {
      $("importBtn").disabled = false;
      $("fileInput").value = "";
    }
  }

  async function renderPdfPages(book) {
    const pdf = await pdfjsLib.getDocument({
      data: book.data instanceof ArrayBuffer
        ? book.data.slice(0)
        : book.data
    }).promise;

    const images = [];
    const total = pdf.numPages;

    for (let number = 1; number <= total; number++) {
      $("pageInfo").textContent =
        `Preparando página ${number} de ${total}...`;

      const page = await pdf.getPage(number);
      const original = page.getViewport({ scale: 1 });

      // Mantiene buena nitidez y limita el uso de memoria.
      const targetWidth = total > 180 ? 900 : total > 90 ? 1050 : 1350;
      const scale = Math.min(2.2, targetWidth / original.width);
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d", { alpha: false });

      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);

      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, canvas.width, canvas.height);

      await page.render({
        canvasContext: context,
        viewport: viewport
      }).promise;

      let url;
      try {
        url = await canvasToUrl(canvas);
      } catch (error) {
        canvas.width = 1;
        canvas.height = 1;
        throw error;
      }

      images.push(url);
      pageUrls.push(url);

      // Libera la memoria del lienzo después de guardar la página.
      canvas.width = 1;
      canvas.height = 1;
      page.cleanup();

      if (number % 8 === 0) {
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }

    return images;
  }

  async function openBook(bookId) {
    const book = books.find(item => item.id === bookId);
    if (!book) return;

    currentBook = book;
    isFullscreen = false;
    $("reader").classList.remove("reader-fullscreen");
    $("reader").classList.add("active");
    $("readerTitle").textContent = book.title;
    $("pageInfo").textContent = "Preparando libro...";
    $("prevBtn").disabled = true;
    $("nextBtn").disabled = true;

    releasePageUrls();
    const root = resetFlipbook();

    try {
      const pageImages = await renderPdfPages(book);
      if (currentBook !== book) return;

      root.style.width = "100%";

      pageFlip = new St.PageFlip(root, {
        width: 420,
        height: 620,
        size: "stretch",
        minWidth: 260,
        maxWidth: 1000,
        minHeight: 340,
        maxHeight: 1400,
        drawShadow: true,
        flippingTime: 700,
        usePortrait: true,
        startPage: Math.max(
          0, Math.min(Number(book.currentPage) || 0, pageImages.length - 1)
        ),
        autoSize: true,
        maxShadowOpacity: 0.45,
        showCover: true,
        mobileScrollSupport: false,
        swipeDistance: 25,
        clickEventForward: true,
        useMouseEvents: true
      });

      pageFlip.on("flip", event => {
        if (!currentBook || !pageFlip) return;
        currentBook.currentPage = event.data;
        updatePageInfo();

        // Guardamos el progreso sin volver a dibujar toda la biblioteca.
        if (!savingProgress) {
          savingProgress = true;
          saveBook(currentBook)
            .catch(console.error)
            .finally(() => { savingProgress = false; });
        }
      });

      pageFlip.loadFromImages(pageImages);
      $("prevBtn").disabled = false;
      $("nextBtn").disabled = false;

      // El lector informa cuando terminó de cargar las imágenes.
      pageFlip.on("init", () => {
        if (currentBook === book) updatePageInfo();
      });

      updatePageInfo();
    } catch (error) {
      console.error(error);
      alert("No pude abrir este libro. Si tiene muchas páginas, probá con un PDF más liviano.");
      closeReader();
    }
  }

  function updatePageInfo() {
    if (!pageFlip || !currentBook) return;
    const page = pageFlip.getCurrentPageIndex();
    const total = pageFlip.getPageCount();

    currentBook.currentPage = page;
    $("pageInfo").textContent =
      `Página ${page + 1} de ${total}` +
      (currentBook.finished ? " · Terminado" : "");

    $("prevBtn").disabled = page <= 0;
    $("nextBtn").disabled = page >= total - 1;
  }

  async function closeReader() {
    if (currentBook && pageFlip) {
      try {
        currentBook.currentPage = pageFlip.getCurrentPageIndex();
        await saveBook(currentBook);
      } catch (error) {
        console.error(error);
      }
    }

    currentBook = null;
    isFullscreen = false;
    $("reader").classList.remove("active", "reader-fullscreen");

    if (pageFlip) {
      try { pageFlip.destroy(); } catch (error) {}
      pageFlip = null;
    }

    $("flipHost").replaceChildren();
    releasePageUrls();

    await refreshLibrary();
  }

  $("prevBtn").addEventListener("click", () => {
    if (pageFlip) pageFlip.flipPrev();
  });

  $("nextBtn").addEventListener("click", () => {
    if (pageFlip) pageFlip.flipNext();
  });

  $("closeBtn").addEventListener("click", closeReader);

  $("fullscreenBtn").addEventListener("click", () => {
    isFullscreen = !isFullscreen;
    $("reader").classList.toggle("reader-fullscreen", isFullscreen);
    $("fullscreenBtn").textContent = isFullscreen
      ? "⛶ Salir de pantalla completa"
      : "⛶ Pantalla completa";

    // Dejamos que el navegador aplique el nuevo tamaño antes de actualizar.
    // No destruimos ni volvemos a cargar las páginas del libro.
    if (pageFlip) {
      requestAnimationFrame(() => {
        setTimeout(() => {
          if (pageFlip) {
            try { pageFlip.update(); } catch (error) {
              console.warn("No se pudo reajustar el libro", error);
            }
          }
        }, 250);
      });
    }
  });

  $("bookmarkBtn").addEventListener("click", async () => {
    if (!currentBook || !pageFlip) return;

    const page = pageFlip.getCurrentPageIndex();
    currentBook.bookmarks = currentBook.bookmarks || [];

    if (!currentBook.bookmarks.includes(page)) {
      currentBook.bookmarks.push(page);
      currentBook.bookmarks.sort((a, b) => a - b);
      await saveBook(currentBook);
      $("bookmarkBtn").textContent = "★ Página guardada";
    } else {
      alert("Esta página ya está guardada en tus marcadores.");
    }
  });

  $("bookmarksBtn").addEventListener("click", () => {
    if (!currentBook || !pageFlip) return;

    const marks = currentBook.bookmarks || [];
    if (!marks.length) {
      alert("Todavía no guardaste páginas.");
      return;
    }

    const choice = prompt(
      "Tus páginas guardadas:\n" +
      marks.map(page => `Página ${page + 1}`).join("\n") +
      "\n\nEscribí el número de página al que querés ir:"
    );

    if (choice === null || choice.trim() === "") return;

    const pageNumber = Number(choice);
    if (Number.isInteger(pageNumber) &&
        pageNumber >= 1 &&
        pageNumber <= pageFlip.getPageCount()) {
      pageFlip.flip(pageNumber - 1);
    } else {
      alert("Ese número no corresponde a una página válida.");
    }
  });

  $("finishBtn").addEventListener("click", async () => {
    if (!currentBook) return;

    currentBook.finished = !currentBook.finished;
    await saveBook(currentBook);

    $("finishBtn").textContent = currentBook.finished
      ? "↩ Marcar como no terminado"
      : "✓ Marcar terminado";

    updatePageInfo();
    await refreshLibrary();
  });

  $("importBtn").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", event => {
    importPdf(event.target.files[0]);
  });

  $("search").addEventListener("input", renderLibrary);

  $("showAllBtn").addEventListener("click", () => {
    filterMode = "all";
    renderLibrary();
  });

  $("showFinishedBtn").addEventListener("click", () => {
    filterMode = "finished";
    renderLibrary();
  });

  $("themeBtn").addEventListener("click", () => {
    document.body.classList.toggle("light");
    localStorage.setItem(
      "mi-biblioteca-theme",
      document.body.classList.contains("light") ? "light" : "dark"
    );
  });

  if (localStorage.getItem("mi-biblioteca-theme") === "light") {
    document.body.classList.add("light");
  }

  document.addEventListener("keydown", event => {
    if (!$("reader").classList.contains("active")) return;
    if (event.key === "Escape" && isFullscreen) {
      isFullscreen = false;
      $("reader").classList.remove("reader-fullscreen");
      $("fullscreenBtn").textContent = "⛶ Pantalla completa";
    } else if (event.key === "ArrowRight" && pageFlip) {
      pageFlip.flipNext();
    } else if (event.key === "ArrowLeft" && pageFlip) {
      pageFlip.flipPrev();
    }
  });

  async function init() {
    try {
      db = await openDatabase();
      await refreshLibrary();
    } catch (error) {
      console.error(error);
      setStatus("No se pudo acceder al almacenamiento. Revisá la configuración del navegador.");
      alert("No se pudo abrir la biblioteca. Tus datos anteriores no se han borrado.");
    }
  }

  init();
})();
</script>
</body>
</html>
