
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b19">
<title>Mi biblioteca</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
:root {
  --bg: #100b19;
  --panel: #1b1427;
  --panel2: #261b35;
  --text: #f8f2ff;
  --muted: #b8a9c8;
  --accent: #c69aff;
  --border: #382747;
  --danger: #ff8f9b;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background: radial-gradient(ellipse at top, #291b3d, var(--bg) 65%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body.light {
  --bg: #f5effb;
  --panel: #fff;
  --panel2: #eee3fa;
  --text: #271a36;
  --muted: #75647f;
  --accent: #8150b6;
  --border: #dfd0ec;
  background: var(--bg);
}
button, input { font: inherit; }
button {
  border: 1px solid var(--border);
  color: var(--text);
  background: var(--panel2);
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary {
  background: var(--accent);
  color: #1b1028;
  font-weight: 700;
}
button.danger { color: var(--danger); }

header {
  padding: 22px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(135deg, #d5b2ff, #8652b5);
  color: #20102e;
  font-size: 24px;
}
h1 { font-size: 22px; margin: 0; }
.subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
main { max-width: 1200px; margin: auto; padding: 24px 16px 60px; }
.intro { margin-bottom: 25px; }
.intro h2 { font-size: 27px; margin: 0 0 8px; }
p { color: var(--muted); line-height: 1.5; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
input[type="search"] {
  flex: 1;
  min-width: 180px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 12px;
  padding: 12px;
}
.section-title { font-size: 17px; margin: 26px 0 15px; }
.library {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 16px;
}
.book-card {
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 16px;
}
.cover {
  height: 175px;
  border-radius: 10px;
  background: linear-gradient(145deg, #49305f, #171020);
  display: grid;
  place-items: center;
  font-size: 44px;
  margin-bottom: 12px;
}
.book-title {
  font-weight: 650;
  font-size: 14px;
  overflow-wrap: anywhere;
  line-height: 1.4;
}
.book-meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
.progress {
  height: 4px;
  border-radius: 9px;
  background: var(--border);
  margin: 10px 0;
  overflow: hidden;
}
.progress span { display: block; height: 100%; background: var(--accent); }
.card-actions { display: grid; gap: 7px; margin-top: 10px; }
.card-actions button { width: 100%; font-size: 12px; padding: 9px 5px; }
.empty {
  border: 1px dashed var(--border);
  border-radius: 16px;
  padding: 28px 18px;
  text-align: center;
  color: var(--muted);
  grid-column: 1 / -1;
}
#status {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

/* Lector */
#reader {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  overflow: auto;
  background: var(--bg);
  padding: max(12px, env(safe-area-inset-top)) 12px
           max(12px, env(safe-area-inset-bottom));
}
#reader.active { display: block; }

.reader-card {
  min-height: 100%;
  max-width: 1200px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.reader-top, .reader-tools, .reader-bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}
.reader-top { justify-content: space-between; }
.reader-top h2 {
  font-size: 15px;
  overflow-wrap: anywhere;
  flex: 1;
  min-width: 100px;
  margin: 0;
  text-align: center;
}
#flipHost {
  width: 100%;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  overflow: hidden;
}
#flipbook { margin: auto; }

/* Cada página conserva su imagen de alta calidad */
.pdf-page {
  width: 100%;
  height: 100%;
  background: #fff;
  overflow: hidden;
  color: #111;
}
.pdf-page img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #fff;
  -webkit-user-drag: none;
  user-select: none;
}
#pageInfo {
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
#exitFullscreenFloat { display: none; }

/* Pantalla completa: ocultamos las barras y dejamos solo el libro */
#reader.reader-fullscreen {
  padding: 0;
  overflow: hidden;
}
#reader.reader-fullscreen .reader-card {
  width: 100%;
  height: 100%;
  height: 100dvh;
  min-height: 0;
  max-width: none;
  gap: 0;
}
#reader.reader-fullscreen .reader-top,
#reader.reader-fullscreen #pageInfo,
#reader.reader-fullscreen .reader-bottom,
#reader.reader-fullscreen .reader-tools {
  display: none !important;
}
#reader.reader-fullscreen #flipHost {
  flex: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}
#reader.reader-fullscreen #flipbook { margin: auto; }

/* Este botón permanece accesible en el iPhone */
#reader.reader-fullscreen #exitFullscreenFloat {
  display: block;
  position: fixed;
  z-index: 100;
  top: max(10px, env(safe-area-inset-top));
  right: 10px;
  border: 1px solid #ffffff55;
  border-radius: 999px;
  color: #fff;
  background: #20152bd9;
  padding: 10px 14px;
  font-size: 13px;
  box-shadow: 0 4px 18px #0005;
}

@media (max-width: 600px) {
  header { padding: 16px 12px; }
  main { padding: 20px 12px 40px; }
  .intro h2 { font-size: 23px; }
  .library { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .book-card { padding: 10px; }
  .cover { height: 145px; }
  button { padding: 9px 11px; }
}
</style>
</head>

<body>
<header>
  <div class="brand">
    <div class="logo">♧</div>
    <div>
      <h1>Mi biblioteca</h1>
      <div class="subtitle">Tu rincón de lectura digital</div>
    </div>
  </div>
  <div class="header-actions">
    <button id="themeBtn" type="button">☼ Tema</button>
    <button class="primary" id="importBtn" type="button">＋ Añadir PDF</button>
    <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
  </div>
</header>

<main id="libraryPage">
  <section class="intro">
    <h2>Un libro, tu propio mundo. 💜</h2>
    <p>Guardá tus libros PDF y retomá la lectura cuando quieras.</p>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar un libro...">
    <button id="showAllBtn" type="button">Todos</button>
    <button id="showFinishedBtn" type="button">Terminados</button>
  </div>

  <div id="status" role="status">Preparando tu biblioteca...</div>
  <h3 class="section-title" id="shelfTitle">Mis libros</h3>
  <section class="library" id="library"></section>
</main>

<section id="reader" aria-label="Lector de libros">
  <div class="reader-card">
    <div class="reader-top">
      <button id="closeBtn" type="button">← Biblioteca</button>
      <h2 id="readerTitle">Leyendo...</h2>
      <button id="fullscreenBtn" type="button">⛶ Pantalla completa</button>
    </div>

    <div id="flipHost">
      <div id="flipbook"></div>
    </div>

    <div id="pageInfo">Preparando páginas...</div>

    <div class="reader-bottom">
      <button id="prevBtn" type="button">← Anterior</button>
      <button id="nextBtn" class="primary" type="button">Siguiente →</button>
    </div>

    <div class="reader-tools">
      <button id="bookmarkBtn" type="button">☆ Guardar página</button>
      <button id="bookmarksBtn" type="button">Mis marcadores</button>
      <button id="finishBtn" type="button">✓ Marcar terminado</button>
    </div>
  </div>

  <button id="exitFullscreenFloat" type="button">
    ✕ Salir de pantalla completa
  </button>
</section>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const DB_NAME = "mi-biblioteca-db";
  const STORE = "books";

  let db;
  let books = [];
  let currentBook = null;
  let pageFlip = null;
  let pageUrls = [];
  let filterMode = "all";
  let isFullscreen = false;
  let progressTimer = null;
  let openingToken = 0;

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  function setStatus(message) {
    $("status").textContent = message;
  }

  function openDatabase() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);

      request.onupgradeneeded = () => {
        const database = request.result;
        if (!database.objectStoreNames.contains(STORE)) {
          database.createObjectStore(STORE, { keyPath: "id" });
        }
      };

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  function getAllBooks() {
    return new Promise((resolve, reject) => {
      const request = db.transaction(STORE, "readonly")
        .objectStore(STORE).getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  function saveBook(book) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE, "readwrite");
      transaction.objectStore(STORE).put(book);
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
      transaction.onabort = () => reject(transaction.error);
    });
  }

  function deleteBook(id) {
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE, "readwrite");
      transaction.objectStore(STORE).delete(id);
      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    });
  }

  function releasePageUrls() {
    pageUrls.forEach(url => URL.revokeObjectURL(url));
    pageUrls = [];
  }

  function destroyFlipbook() {
    if (pageFlip) {
      try { pageFlip.destroy(); } catch (error) {
        console.warn("No se pudo cerrar el efecto de páginas", error);
      }
      pageFlip = null;
    }

    // StPageFlip elimina su elemento raíz al destruirse.
    // Creamos un nuevo elemento para la próxima lectura.
    $("flipHost").replaceChildren();

    const root = document.createElement("div");
    root.id = "flipbook";
    $("flipHost").appendChild(root);

    return root;
  }

  function renderLibrary() {
    const query = $("search").value.trim().toLowerCase();
    const filtered = books.filter(book => {
      const matchesSearch = String(book.title || "")
        .toLowerCase().includes(query);
      const matchesMode = filterMode === "all" || book.finished;
      return matchesSearch && matchesMode;
    });

    $("shelfTitle").textContent =
      filterMode === "finished" ? "Libros terminados" : "Mis libros";

    const container = $("library");
    container.replaceChildren();

    if (!filtered.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = query
        ? "No encontré libros con ese nombre."
        : filterMode === "finished"
          ? "Todavía no marcaste libros como terminados."
          : "Tu biblioteca está esperando su primer libro. 💜";
      container.appendChild(empty);
      return;
    }

    filtered.forEach(book => {
      const card = document.createElement("article");
      card.className = "book-card";

      const cover = document.createElement("div");
      cover.className = "cover";
      cover.textContent = book.finished ? "✓" : "📖";

      const title = document.createElement("div");
      title.className = "book-title";
      title.textContent = book.title || "Libro sin título";

      const total = Number(book.totalPages) || 0;
      const current = Number(book.currentPage) || 0;
      const progress = total
        ? Math.min(100, Math.round(((current + 1) / total) * 100))
        : 0;

      const meta = document.createElement("div");
      meta.className = "book-meta";
      meta.textContent = book.finished ? "Terminado ✓" : `${progress}% leído`;

      const bar = document.createElement("div");
      bar.className = "progress";
      const fill = document.createElement("span");
      fill.style.width = progress + "%";
      bar.appendChild(fill);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const readBtn = document.createElement("button");
      readBtn.className = "primary";
      readBtn.textContent = "Leer libro";
      readBtn.addEventListener("click", () => openBook(book.id));

      const removeBtn = document.createElement("button");
      removeBtn.className = "danger";
      removeBtn.textContent = "Eliminar";
      removeBtn.addEventListener("click", async () => {
        if (!confirm(`¿Eliminar "${book.title}" de tu biblioteca?`)) return;
        try {
          await deleteBook(book.id);
          await refreshLibrary();
          setStatus("Libro eliminado.");
        } catch (error) {
          alert("No se pudo eliminar el libro.");
        }
      });

      actions.append(readBtn, removeBtn);
      card.append(cover, title, meta, bar, actions);
      container.appendChild(card);
    });
  }

  async function refreshLibrary() {
    books = await getAllBooks();
    books.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderLibrary();
    setStatus(`${books.length} libro(s) en tu biblioteca.`);
  }

  async function importPdf(file) {
    if (!file) return;

    if (file.type !== "application/pdf" &&
        !file.name.toLowerCase().endsWith(".pdf")) {
      alert("Elegí un archivo PDF.");
      return;
    }

    $("importBtn").disabled = true;
    setStatus("Importando PDF...");

    try {
      const data = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({
        data: data.slice(0)
      }).promise;

      const id = crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random().toString(16).slice(2)}`;

      const book = {
        id,
        title: file.name.replace(/\.pdf$/i, ""),
        filename: file.name,
        data,
        totalPages: pdf.numPages,
        currentPage: 0,
        finished: false,
        bookmarks: [],
        createdAt: Date.now()
      };

      await saveBook(book);
      await refreshLibrary();
      setStatus(`"${book.title}" se agregó correctamente.`);
    } catch (error) {
      console.error(error);
      alert("No pude importar el PDF. Puede estar dañado o ser demasiado grande.");
      setStatus("No se pudo importar el PDF.");
    } finally {
      $("importBtn").disabled = false;
      $("fileInput").value = "";
    }
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (!blob) {
          reject(new Error("No se pudo crear la imagen de la página."));
          return;
        }
        resolve(blob);
      }, "image/webp", 0.99);
    });
  }

  async function createHtmlPages(book, root, token) {
    const pdf = await pdfjsLib.getDocument({
      data: book.data instanceof ArrayBuffer
        ? book.data.slice(0)
        : book.data
    }).promise;

    const total = pdf.numPages;

    for (let number = 1; number <= total; number++) {
      if (token !== openingToken) {
        throw new Error("La apertura del libro fue cancelada.");
      }

      $("pageInfo").textContent = `Preparando página ${number} de ${total}...`;

      const page = await pdf.getPage(number);
      const base = page.getViewport({ scale: 1 });

      // Mayor resolución para conservar la legibilidad del texto.
      const targetWidth = total > 220 ? 1400 : 1800;
      const scale = Math.min(2.6, targetWidth / base.width);
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);

      const context = canvas.getContext("2d", { alpha: false });
      if (!context) throw new Error("No se pudo crear el lienzo del PDF.");

      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, canvas.width, canvas.height);

      await page.render({
        canvasContext: context,
        viewport
      }).promise;

      let blob;
      try {
        blob = await canvasToBlob(canvas);
      } finally {
        // No mantenemos los lienzos originales en memoria.
        canvas.width = 1;
        canvas.height = 1;
        page.cleanup();
      }

      const url = URL.createObjectURL(blob);
      pageUrls.push(url);

      const pageElement = document.createElement("div");
      pageElement.className = "pdf-page";

      const image = document.createElement("img");
      image.src = url;
      image.alt = `Página ${number}`;
      image.draggable = false;
      image.decoding = "async";

      pageElement.appendChild(image);
      root.appendChild(pageElement);

      if (number % 6 === 0) {
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }

    return total;
  }

  async function openBook(bookId) {
    const book = books.find(item => item.id === bookId);
    if (!book) return;

    openingToken++;
    const token = openingToken;

    if (progressTimer) {
      clearTimeout(progressTimer);
      progressTimer = null;
    }

    if (pageFlip) {
      try { pageFlip.destroy(); } catch (error) {}
      pageFlip = null;
    }

    releasePageUrls();

    currentBook = book;
    isFullscreen = false;
    $("reader").classList.remove("reader-fullscreen");
    $("reader").classList.add("active");
    $("fullscreenBtn").textContent = "⛶ Pantalla completa";
    $("readerTitle").textContent = book.title;
    $("pageInfo").textContent = "Preparando páginas...";
    $("finishBtn").textContent = book.finished
      ? "↩ Marcar como no terminado"
      : "✓ Marcar terminado";

    const root = destroyFlipbook();
    $("prevBtn").disabled = true;
    $("nextBtn").disabled = true;

    try {
      const total = await createHtmlPages(book, root, token);
      if (token !== openingToken || currentBook !== book) return;

      pageFlip = new St.PageFlip(root, {
        width: 420,
        height: 620,
        size: "stretch",
        minWidth: 260,
        maxWidth: 1000,
        minHeight: 340,
        maxHeight: 1400,
        drawShadow: true,
        flippingTime: 750,
        usePortrait: true,
        startPage: Math.max(
          0, Math.min(Number(book.currentPage) || 0, total - 1)
        ),
        autoSize: true,
        maxShadowOpacity: 0.4,
        showCover: true,
        mobileScrollSupport: false,
        swipeDistance: 25,
        clickEventForward: true,
        useMouseEvents: true
      });

      pageFlip.on("flip", event => {
        if (!currentBook || !pageFlip) return;

        currentBook.currentPage = event.data;
        updatePageInfo();

        // Agrupamos los guardados para evitar trabajo en cada movimiento.
        if (progressTimer) clearTimeout(progressTimer);
        const bookToSave = currentBook;

        progressTimer = setTimeout(() => {
          saveBook(bookToSave).catch(console.error);
          progressTimer = null;
        }, 250);
      });

      pageFlip.on("init", () => {
        if (currentBook === book) updatePageInfo();
      });

      pageFlip.loadFromHTML(root.querySelectorAll(".pdf-page"));
      $("prevBtn").disabled = false;
      $("nextBtn").disabled = false;
      updatePageInfo();
    } catch (error) {
      if (token !== openingToken) return;
      console.error(error);
      alert("No pude abrir este PDF. Probá con un archivo más liviano si tiene muchísimas páginas.");
      await closeReader();
    }
  }

  function updatePageInfo() {
    if (!pageFlip || !currentBook) return;

    const page = pageFlip.getCurrentPageIndex();
    const total = pageFlip.getPageCount();

    currentBook.currentPage = page;
    $("pageInfo").textContent =
      `Página ${page + 1} de ${total}` +
      (currentBook.finished ? " · Terminado" : "");

    $("prevBtn").disabled = page <= 0;
    $("nextBtn").disabled = page >= total - 1;
  }

  async function closeReader() {
    openingToken++;

    if (progressTimer) {
      clearTimeout(progressTimer);
      progressTimer = null;
    }

    if (currentBook && pageFlip) {
      try {
        currentBook.currentPage = pageFlip.getCurrentPageIndex();
        await saveBook(currentBook);
      } catch (error) {
        console.error(error);
      }
    }

    currentBook = null;
    isFullscreen = false;
    $("reader").classList.remove("active", "reader-fullscreen");
    $("fullscreenBtn").textContent = "⛶ Pantalla completa";

    if (pageFlip) {
      try { pageFlip.destroy(); } catch (error) {}
      pageFlip = null;
    }

    $("flipHost").replaceChildren();
    releasePageUrls();

    await refreshLibrary();
  }

  function toggleFullscreen() {
    isFullscreen = !isFullscreen;
    $("reader").classList.toggle("reader-fullscreen", isFullscreen);
    $("fullscreenBtn").textContent = isFullscreen
      ? "⛶ Salir de pantalla completa"
      : "⛶ Pantalla completa";

    // Recalcula el área del libro después de aplicar el nuevo tamaño.
    if (pageFlip) {
      setTimeout(() => {
        if (pageFlip && isFullscreen) {
          try { pageFlip.update(); } catch (error) {
            console.warn("No se pudo ajustar el libro", error);
          }
        }
      }, 250);
    }
  }

  $("prevBtn").addEventListener("click", () => {
    if (pageFlip) pageFlip.flipPrev();
  });

  $("nextBtn").addEventListener("click", () => {
    if (pageFlip) pageFlip.flipNext();
  });

  $("closeBtn").addEventListener("click", closeReader);
  $("fullscreenBtn").addEventListener("click", toggleFullscreen);
  $("exitFullscreenFloat").addEventListener("click", toggleFullscreen);

  $("bookmarkBtn").addEventListener("click", async () => {
    if (!currentBook || !pageFlip) return;

    const page = pageFlip.getCurrentPageIndex();
    currentBook.bookmarks = currentBook.bookmarks || [];

    if (!currentBook.bookmarks.includes(page)) {
      currentBook.bookmarks.push(page);
      currentBook.bookmarks.sort((a, b) => a - b);
      await saveBook(currentBook);
      $("bookmarkBtn").textContent = "★ Página guardada";
    } else {
      alert("Esta página ya está guardada en tus marcadores.");
    }
  });

  $("bookmarksBtn").addEventListener("click", () => {
    if (!currentBook || !pageFlip) return;

    const marks = currentBook.bookmarks || [];
    if (!marks.length) {
      alert("Todavía no guardaste páginas.");
      return;
    }

    const choice = prompt(
      "Páginas guardadas:\n" +
      marks.map(page => `Página ${page + 1}`).join("\n") +
      "\n\nEscribí el número de página al que querés ir:"
    );

    if (choice === null || choice.trim() === "") return;

    const pageNumber = Number(choice);
    if (Number.isInteger(pageNumber) &&
        pageNumber >= 1 &&
        pageNumber <= pageFlip.getPageCount()) {
      pageFlip.flip(pageNumber - 1);
    } else {
      alert("Ese número no corresponde a una página válida.");
    }
  });

  $("finishBtn").addEventListener("click", async () => {
    if (!currentBook) return;

    currentBook.finished = !currentBook.finished;
    await saveBook(currentBook);

    $("finishBtn").textContent = currentBook.finished
      ? "↩ Marcar como no terminado"
      : "✓ Marcar terminado";

    updatePageInfo();
    await refreshLibrary();
  });

  $("importBtn").addEventListener("click", () => $("fileInput").click());

  $("fileInput").addEventListener("change", event => {
    importPdf(event.target.files[0]);
  });

  $("search").addEventListener("input", renderLibrary);

  $("showAllBtn").addEventListener("click", () => {
    filterMode = "all";
    renderLibrary();
  });

  $("showFinishedBtn").addEventListener("click", () => {
    filterMode = "finished";
    renderLibrary();
  });

  $("themeBtn").addEventListener("click", () => {
    document.body.classList.toggle("light");
    localStorage.setItem(
      "mi-biblioteca-theme",
      document.body.classList.contains("light") ? "light" : "dark"
    );
  });

  if (localStorage.getItem("mi-biblioteca-theme") === "light") {
    document.body.classList.add("light");
  }

  document.addEventListener("keydown", event => {
    if (!$("reader").classList.contains("active")) return;

    if (event.key === "Escape" && isFullscreen) {
      toggleFullscreen();
    } else if (event.key === "ArrowRight" && pageFlip) {
      pageFlip.flipNext();
    } else if (event.key === "ArrowLeft" && pageFlip) {
      pageFlip.flipPrev();
    }
  });

  async function init() {
    try {
      if (!window.St || !window.St.PageFlip || !window.pdfjsLib) {
        throw new Error("No se pudieron cargar las bibliotecas del lector.");
      }

      db = await openDatabase();
      await refreshLibrary();
    } catch (error) {
      console.error(error);
      setStatus("No se pudo iniciar la biblioteca. Revisá tu conexión.");
      alert("No se pudo iniciar el lector. Comprobá tu conexión a Internet.");
    }
  }

  init();
})();
</script>
</body>
</html>
